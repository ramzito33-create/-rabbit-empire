<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rabbit Empire</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0d141f;
            --card-bg: #1a2431;
            --info-box: #121a26;
            --accent-blue: #5d87ff;
            --text-gray: #8b99a7;
            --carrot-orange: #ff9f43;
        }

        body {
            background-color: var(--bg-color);
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 15px;
            padding-bottom: 100px;
            direction: ltr;
        }

        /* Header Area */
        .top-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .user-pill {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .user-img {
            width: 38px;
            height: 38px;
            background: #253341;
            border-radius: 50%;
        }

        .user-details { font-size: 13px; font-weight: bold; }
        .user-handle { color: var(--accent-blue); font-size: 10px; }

        .top-stats { display: flex; gap: 8px; }
        .stat-pill {
            background: rgba(255, 255, 255, 0.05);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        /* Mining Card */
        .rabbit-card {
            background: var(--card-bg);
            border-radius: 35px;
            padding: 20px;
            margin-bottom: 15px;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .card-top {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
        }

        .char-frame {
            width: 75px;
            height: 75px;
            background: #d6e8f4;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 45px;
        }

        .card-meta h3 { margin: 0; font-size: 17px; letter-spacing: 0.3px; }
        .lock-status { color: var(--accent-blue); font-size: 11px; font-weight: bold; }
        .limit-info { margin-left: auto; text-align: right; font-size: 11px; color: var(--text-gray); }

        /* Grid Info */
        .info-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 15px;
        }

        .grid-box {
            background: var(--info-box);
            padding: 10px;
            border-radius: 18px;
            text-align: center;
        }

        .box-label { font-size: 9px; color: var(--text-gray); margin-bottom: 4px; font-weight: bold; }
        .box-val { font-size: 13px; font-weight: bold; }

        /* Action Buttons */
        .action-row { display: flex; gap: 10px; }
        .produced-display {
            flex: 1;
            background: rgba(255,255,255,0.02);
            border-radius: 18px;
            padding: 12px;
            text-align: center;
        }

        .buy-action-btn {
            flex: 1.5;
            background: #3a272c;
            border: 1px solid #5a2c2c;
            border-radius: 18px;
            color: #ff5252;
            padding: 12px;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        /* Navbar */
        .nav-bar {
            position: fixed;
            bottom: 20px;
            left: 15px;
            right: 15px;
            background: rgba(20, 28, 38, 0.95);
            backdrop-filter: blur(15px);
            border-radius: 30px;
            display: flex;
            padding: 12px;
            justify-content: space-around;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .nav-link { text-align: center; color: var(--text-gray); font-size: 9px; font-weight: bold; }
        .nav-link.active { color: white; background: #2c3a4a; padding: 8px 18px; border-radius: 20px; margin-top: -5px; }

    </style>
</head>
<body>

    <div class="top-header">
        <div class="user-pill">
            <div class="user-img"></div>
            <div class="user-details">
                LIGHT👑 <br>
                <span class="user-handle">@y888el</span>
            </div>
        </div>
        <div class="top-stats">
            <div class="stat-pill">💎 0</div>
            <div class="stat-pill">🥕 0</div>
        </div>
    </div>

    <div class="rabbit-card">
        <div class="card-top">
            <div class="char-frame">🐰</div>
            <div class="card-meta">
                <h3>BABY RABBIT LV.1</h3>
                <div class="lock-status">● LOCKED</div>
            </div>
            <div class="limit-info">LIMIT<br><b style="color:white">0</b>/10</div>
        </div>
        <div class="info-grid">
            <div class="grid-box"><div class="label">COST</div><div class="box-val" style="color:#f1c40f">0.1 💎</div></div>
            <div class="grid-box"><div class="label">CARROT /1H</div><div class="box-val" style="color:#3498db">+3 🥕</div></div>
            <div class="grid-box"><div class="label">CARROT /24H</div><div class="box-val" style="color:#1abc9c">+72 🥕</div></div>
        </div>
        <div class="action-row">
            <div class="produced-display"><div class="label">PRODUCED</div><div class="box-val">0.0000 🥕</div></div>
            <div class="buy-action-btn">
                <div style="font-size:12px; font-weight:bold">NEED 0.1000 💎</div>
                <div style="font-size:8px; opacity:0.7">INSUFFICIENT BALANCE</div>
            </div>
        </div>
    </div>

    <div class="nav-bar">
        <div class="nav-link">👛<br>WALLET</div>
        <div class="nav-link">👥<br>FRIENDS</div>
        <div class="nav-link active">🏠<br>HOME</div>
        <div class="nav-link">🔄<br>TRADE</div>
        <div class="nav-link">...<br>MORE</div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.headerColor = "#0d141f";
    </script>
</body>
</html>
