<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rabbit Empire</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --bg: #0a0f1b; --card-bg: #1e293b; --accent: #ff9f43; --blue: #5d88ff; }
        body { 
            background: var(--bg); 
            color: white; 
            font-family: -apple-system, BlinkMacSystemFont, sans-serif; 
            margin: 0; padding: 15px; padding-bottom: 100px;
            background: radial-gradient(circle at top, #1e293b, #0a0f1b);
        }
        
        .header { display: flex; justify-content: space-between; gap: 10px; margin-bottom: 25px; }
        .balance-box { flex: 1; background: rgba(255,255,255,0.05); padding: 12px; border-radius: 20px; text-align: center; border: 1px solid rgba(255,255,255,0.1); }
        .balance-box span { display: block; font-size: 10px; color: #8899a6; margin-bottom: 5px; }
        .balance-box b { font-size: 16px; color: var(--accent); }
        
        .card { background: var(--card-bg); border-radius: 30px; padding: 20px; margin-bottom: 15px; border: 1px solid rgba(255,255,255,0.08); box-shadow: 0 10px 20px rgba(0,0,0,0.2); }
        .card-header { display: flex; align-items: center; gap: 15px; margin-bottom: 15px; }
        .rabbit-img { width: 70px; height: 70px; background: #0f172a; border-radius: 20px; display: flex; align-items: center; justify-content: center; font-size: 35px; border: 1px solid rgba(255,255,255,0.05); }
        
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 15px; }
        .grid-item { background: rgba(0,0,0,0.25); padding: 10px 5px; border-radius: 15px; text-align: center; }
        .grid-item div { font-size: 9px; color: #64748b; margin-bottom: 4px; font-weight: bold; }
        .grid-item b { font-size: 12px; }

        .btn-buy { width: 100%; background: linear-gradient(135deg, #3a272c, #5a2c2c); border: 1px solid #7a3a3a; color: #ff5252; padding: 15px; border-radius: 18px; font-weight: bold; cursor: pointer; }
        
        .navbar { position: fixed; bottom: 20px; left: 15px; right: 15px; background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(10px); display: flex; justify-content: space-around; padding: 12px; border-radius: 25px; border: 1px solid rgba(255,255,255,0.1); }
        .nav-item { color: #64748b; font-size: 10px; text-align: center; font-weight: bold; }
        .nav-item.active { color: white; }
    </style>
</head>
<body>

    <div class="header">
        <div class="balance-box"><span>🥕 CARROTS</span><b id="carrots-val">0.00</b></div>
        <div class="balance-box"><span>💎 TON</span><b id="ton-val">0.500</b></div>
    </div>

    <div class="card">
        <div class="card-header">
            <div class="rabbit-img">🐰</div>
            <div><b style="font-size:18px;">BABY RABBIT LV.1</b><br><small style="color:#5d88ff; font-weight:bold;">● LOCKED</small></div>
            <div style="margin-left:auto; text-align:right; color:#8b99a7;"><small>LIMIT</small><br><b style="color:white">0/10</b></div>
        </div>
        <div class="grid">
            <div class="grid-item"><div>COST</div><b>0.1 💎</b></div>
            <div class="grid-item"><div>1H</div><b style="color:#3498db">+3 🥕</b></div>
            <div class="grid-item"><div>24H</div><b style="color:#1abc9c">+72 🥕</b></div>
        </div>
        <button class="btn-buy">NEED 0.1000 💎<br><small style="font-size:8px; opacity:0.6;">INSUFFICIENT BALANCE</small></button>
    </div>

    <div class="card">
        <div class="card-header">
            <div class="rabbit-img">🥕</div>
            <div><b style="font-size:18px;">FARMER RABBIT LV.2</b><br><small style="color:#5d88ff; font-weight:bold;">● LOCKED</small></div>
            <div style="margin-left:auto; text-align:right; color:#8b99a7;"><small>LIMIT</small><br><b style="color:white">0/10</b></div>
        </div>
        <div class="grid">
            <div class="grid-item"><div>COST</div><b>0.25 💎</b></div>
            <div class="grid-item"><div>1H</div><b style="color:#3498db">+7 🥕</b></div>
            <div class="grid-item"><div>24H</div><b style="color:#1abc9c">+168 🥕</b></div>
        </div>
        <button class="btn-buy">NEED 0.2500 💎<br><small style="font-size:8px; opacity:0.6;">INSUFFICIENT BALANCE</small></button>
    </div>

    <div class="navbar">
        <div class="nav-item"><i>👛</i><br>WALLET</div>
        <div class="nav-item"><i>👥</i><br>FRIENDS</div>
        <div class="nav-item active"><i>🏠</i><br>HOME</div>
        <div class="nav-item"><i>🔄</i><br>TRADE</div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.headerColor = "#16212e";
        tg.backgroundColor = "#0a0f1b";
    </script>
</body>
</html>
