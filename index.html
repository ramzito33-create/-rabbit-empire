<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rabbit Empire - Snow Party Clone</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-dark: #0a0f1b;
            --card-bg: #1c2733;
            --blue-accent: #4e8cff;
            --ton-blue: #0088cc;
            --snow-white: #e3f2fd;
            --carrot-orange: #ff9f43;
            --danger-red: #ff4d4d;
            --danger-bg: rgba(255, 77, 77, 0.1);
        }

        body {
            background: radial-gradient(circle at top, #1c2b3e 0%, #0a0f1b 100%);
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0; padding: 15px; padding-bottom: 120px;
            -webkit-user-select: none;
        }

        /* Top Header */
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        .profile { display: flex; align-items: center; gap: 10px; }
        .avatar { width: 40px; height: 40px; background: #253341; border-radius: 50%; border: 1px solid rgba(255,255,255,0.1); }
        .name-box { font-size: 13px; font-weight: bold; }
        .username { color: var(--blue-accent); font-size: 11px; }

        .stats { display: flex; gap: 8px; }
        .stat-item {
            background: rgba(255, 255, 255, 0.05);
            padding: 6px 14px; border-radius: 20px;
            font-size: 14px; font-weight: bold;
            display: flex; align-items: center; gap: 6px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* Mining Cards */
        .card {
            background: var(--card-bg);
            border-radius: 35px; padding: 20px;
            margin-bottom: 18px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
        }

        .card-header { display: flex; align-items: center; gap: 15px; margin-bottom: 20px; }
        .char-img { 
            width: 75px; height: 75px; background: #e3f2fd; 
            border-radius: 20px; display: flex; align-items: center; justify-content: center;
            font-size: 45px; box-shadow: inset 0 0 15px rgba(0,0,0,0.1);
        }

        .card-info h3 { margin: 0; font-size: 18px; font-weight: 800; }
        .status { color: var(--blue-accent); font-size: 12px; font-weight: bold; display: flex; align-items: center; gap: 4px; }
        .limit { margin-left: auto; text-align: right; font-size: 11px; color: #7f8c8d; }

        /* Stats Grid */
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 18px; }
        .grid-box { background: #121a24; padding: 12px 5px; border-radius: 18px; text-align: center; }
        .label { font-size: 9px; color: #7f8c8d; margin-bottom: 5px; font-weight: bold; }
        .val { font-size: 13px; font-weight: bold; }

        /* Produced & Button Row */
        .card-footer { display: flex; gap: 12px; }
        .produced { flex: 1; background: #121a24; border-radius: 20px; padding: 12px; text-align: center; }
        
        .buy-btn {
            flex: 1.5;
            background: #2a1b1e;
            border: 1px solid #4a2525;
            border-radius: 20px;
            padding: 12px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        .btn-text { color: var(--danger-red); font-weight: 800; font-size: 13px; }
        .btn-sub { color: var(--danger-red); font-size: 8px; opacity: 0.6; font-weight: bold; }

        /* Navigation Bar */
        .nav {
            position: fixed; bottom: 25px; left: 15px; right: 15px;
            background: rgba(26, 38, 52, 0.95);
            backdrop-filter: blur(15px);
            border-radius: 30px;
            display: flex; justify-content: space-around;
            padding: 12px; border: 1px solid rgba(255,255,255,0.05);
        }
        .nav-item { color: #64748b; font-size: 10px; text-align: center; font-weight: bold; cursor: pointer; }
        .nav-item.active { 
            color: white; background: #2c3e50; 
            padding: 10px 20px; border-radius: 22px; 
            margin-top: -8px; 
        }
        .nav-item i { display: block; font-size: 18px; margin-bottom: 4px; }

    </style>
</head>
<body>

    <div class="header">
        <div class="profile">
            <div class="avatar"></div>
            <div class="name-box">LIGHT👑 <br><span class="username">@y888el</span></div>
        </div>
        <div class="stats">
            <div class="stat-item">💎 0</div>
            <div class="stat-item">🥕 2</div>
        </div>
    </div>

    <div class="card">
        <div class="card-header">
            <div class="char-img">🐰</div>
            <div class="card-info">
                <h3>BABY RABBIT LV.1</h3>
                <div class="status"><span style="font-size: 8px;">●</span> LOCKED</div>
            </div>
            <div class="limit">LIMIT<br><b style="color:white">0</b>/10</div>
        </div>
        <div class="grid">
            <div class="grid-box"><div class="label">COST</div><div class="val" style="color: #ffcc00;">0.1 💎</div></div>
            <div class="grid-box"><div class="label">CARROT /1H</div><div class="val" style="color: #3498db;">+3 🥕</div></div>
            <div class="grid-box"><div class="label">CARROT /24H</div><div class="val" style="color: #2ecc71;">+72 🥕</div></div>
        </div>
        <div class="card-footer">
            <div class="produced"><div class="label">PRODUCED</div><div class="val">0.0000 🥕</div></div>
            <div class="buy-btn">
                <div class="btn-text">NEED 0.1000 💎</div>
                <div class="btn-sub">INSUFFICIENT BALANCE</div>
            </div>
        </div>
    </div>

    <div class="card">
        <div class="card-header">
            <div class="char-img">🥕</div>
            <div class="card-info">
                <h3>FARMER RABBIT LV.
