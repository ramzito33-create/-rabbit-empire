<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TON EMPIRE</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        /* كود تنسيق بسيط وقوي لضمان التحميل */
        body {
            background: #02050a;
            background-image: radial-gradient(circle at 50% 20%, #1e3a5f 0%, #02050a 100%);
            color: white;
            font-family: sans-serif;
            margin: 0; padding: 15px;
            text-align: center;
        }

        /* حاوية العملات */
        .stats {
            display: flex; gap: 10px; margin-bottom: 30px;
        }
        .stat-card {
            flex: 1; background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px; padding: 12px;
            display: flex; justify-content: space-between; align-items: center;
        }

        /* الماكينة المركزية - استخدمت صورة موثوقة للتحميل */
        .machine {
            width: 220px; height: 220px;
            background: url('https://w7.pngwing.com/pngs/309/250/png-transparent-robot-head-mecha-fictional-character-robot-thumbnail.png') center/contain no-repeat;
            filter: drop-shadow(0 0 20px #00d2ff);
            margin: 40px auto;
        }

        /* الزر الذهبي */
        .gold-btn {
            background: linear-gradient(180deg, #ffd700 0%, #ff914d 100%);
            width: 100%; padding: 18px; border-radius: 20px;
            border: none; color: #3d2b00; font-weight: bold; font-size: 24px;
            box-shadow: 0 10px 20px rgba(255, 145, 77, 0.3);
        }

        /* القائمة السفلية */
        .nav {
            position: fixed; bottom: 10px; left: 10px; right: 10px;
            background: rgba(13, 21, 35, 0.9);
            border-radius: 25px; display: flex; justify-content: space-around;
            padding: 15px; border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body>

    <div class="stats">
        <div class="stat-card">
            <div>CASH<br><b style="color: #2ecc71;">$0.2621</b></div>
            <span style="font-size: 20px;">💵</span>
        </div>
        <div class="stat-card">
            <div>GEMS<br><b>8</b></div>
            <span style="font-size: 20px;">💎</span>
        </div>
    </div>

    <div class="machine"></div>

    <button class="gold-btn">
        <span style="font-size: 10px; font-weight: normal; display: block;">MINING...</span>
        1.565960
    </button>

    <div class="nav">
        <span>🏠 Home</span>
        <span>⛏️ Miners</span>
        <span>👥 Friends</span>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();
    </script>
</body>
</html>
