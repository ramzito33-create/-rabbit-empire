<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TON EMPIRE VIP</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background: #03070c; color: white;
            font-family: sans-serif; margin: 0; padding: 20px;
            display: flex; flex-direction: column; align-items: center;
            height: 100vh; overflow: hidden;
        }
        /* تصميم النواة الخارقة */
        .core {
            width: 150px; height: 150px;
            background: radial-gradient(circle, #00f2ff 0%, transparent 70%);
            border-radius: 50%; box-shadow: 0 0 50px #00f2ff;
            margin: 50px 0; animation: pulse 2s infinite alternate;
        }
        .balance-box {
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
            padding: 20px; border-radius: 20px; width: 100%; text-align: center;
        }
        #amount { font-size: 35px; font-weight: bold; color: #00f2ff; }
        @keyframes pulse { from { transform: scale(1); opacity: 0.8; } to { transform: scale(1.1); opacity: 1; } }
    </style>
</head>
<body>
    <h2>إمبراطورية الأرنب 🥕</h2>
    <div class="core"></div>
    <div class="balance-box">
        <div style="font-size: 12px; color: #888;">رصيدك الحالي</div>
        <div id="amount">0.000000</div>
    </div>
    <script>
        const tg = window.Telegram.WebApp;
        tg.expand(); // لفتح الشاشة كاملة فوراً
        
        let bal = 0.0;
        setInterval(() => {
            bal += 0.00001;
            document.getElementById('amount').innerText = bal.toFixed(6);
        }, 100);
    </script>
</body>
</html>
