<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TON EMPIRE: ULTRA-EDITION</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700&family=JetBrains+Mono:wght@600&display=swap" rel="stylesheet">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg: #03070c;
            --accent: #00f2ff;
            --gold: #ffcf4d;
            --glass: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 255, 255, 0.07);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: var(--bg);
            background-image: 
                radial-gradient(circle at 50% -10%, rgba(0, 242, 255, 0.1), transparent 50%),
                radial-gradient(circle at 0% 100%, rgba(255, 207, 77, 0.05), transparent 40%);
            color: #fff; font-family: 'Space Grotesk', sans-serif;
            height: 100vh; overflow: hidden; display: flex; flex-direction: column;
        }

        .container { flex: 1; padding: 25px; overflow-y: auto; padding-bottom: 100px; scrollbar-width: none; }
        .container::-webkit-scrollbar { display: none; }

        .view { display: none; animation: ios-slide 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        .view.active { display: block; }

        @keyframes ios-slide {
            from { opacity: 0; transform: scale(0.95) translateY(10px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        /* --- نوار التحكم العلوي --- */
        .top-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .status-pill { background: var(--glass); border: 1px solid var(--border); padding: 6px 14px; border-radius: 40px; display: flex; align-items: center; gap: 8px; font-size: 11px; font-weight: 700; letter-spacing: 1px; }
        .status-dot { width: 6px; height: 6px; background: var(--accent); border-radius: 50%; box-shadow: 0 0 10px var(--accent); animation: pulse 1.5s infinite; }

        /* --- واجهة الرصيد --- */
        .balance-hero { text-align: center; margin: 20px 0 40px; }
        .bal-label { font-size: 11px; color: #666; font-weight: 700; letter-spacing: 2px; }
        .bal-val { font-family: 'JetBrains Mono', monospace; font-size: 44px; margin: 5px 0; background: linear-gradient(to bottom, #fff, #888); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        /* --- المفاعل النووي (The Reactor) --- */
        .core-wrap { position: relative; width: 220px; height: 220px; margin: 0 auto 30px; display: flex; align-items: center; justify-content: center; }
        .ring { position: absolute; border-radius: 50%; border: 1px solid var(--border); }
        .ring-1 { width: 100%; height: 100%; border-style: dashed; animation: rotate 20s linear infinite; }
        .ring-2 { width: 80%; height: 80%; border: 1px solid rgba(0,242,255,0.2); animation: rotate 10s linear infinite reverse; }
        .main-core { width: 90px; height: 90px; background: var(--accent); border-radius: 35% 65% 64% 36% / 30% 30% 70% 70%; filter: blur(2px); box-shadow: 0 0 50px var(--accent); animation: blob 5s ease-in-out infinite, core-pulse 2s infinite alternate; }

        /* --- بطاقات المتجر (Miners) --- */
        .card { background: var(--glass); border: 1px solid var(--border); border-radius: 24px; padding: 20px; margin-bottom: 15px; display: flex; align-items: center; justify-content: space-between; transition: 0.3s; }
        .card:active { transform: scale(0.97); background: rgba(255,255,255,0.06); }
        .card-icon { width: 50px; height: 50px; background: rgba(255,207,77,0.1); border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 24px; }
        .card-info { flex: 1; margin: 0 15px; }
        .card-info h3 { font-size: 15px; font-weight: 700; margin-bottom: 4px; }
        .card-info p { font-size: 11px; color: #666; }
        .price-tag { background: var(--gold); color: #000; padding: 8px 15px; border-radius: 14px; font-size: 13px; font-weight: 800; }
