<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Meme Mining Pro</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --neon-blue: #00d2ff;
            --neon-purple: #9d50bb;
            --gold: #ffcc33;
            --dark-bg: #02050a;
        }

        body {
            background: var(--dark-bg);
            background-image: 
                radial-gradient(circle at 50% 10%, rgba(0, 210, 255, 0.15), transparent),
                radial-gradient(circle at 10% 90%, rgba(157, 80, 187, 0.1), transparent);
            color: white;
            font-family: 'Orbitron', sans-serif; /* خط تقني */
            margin: 0; padding: 15px; overflow-x: hidden;
            height: 100vh;
        }

        /* رأس الصفحة - العملات بتأثير زجاجي متوهج */
        .header-stats {
            display: flex; gap: 12px; margin-bottom: 25px;
        }
        .glass-pill {
            flex: 1; background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px; padding: 12px;
            display: flex; align-items: center; justify-content: space-between;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        /* الماكينة المركزية - تأثير ثلاثي الأبعاد */
        .mining-container {
            position: relative; display: flex; justify-content: center; align-items: center;
            height: 300px; margin: 20px 0;
        }
        .aura {
            position: absolute; width: 250px; height: 250px;
            background: var(--neon-blue); filter: blur(80px); opacity: 0.2;
            animation: pulse-aura 4s infinite alternate;
        }
        .main-machine {
            width: 240px; z-index: 2;
            filter: drop-shadow(0 0 20px var(--neon-blue));
            animation: float 3s infinite ease-in-out;
        }

        /* الزر الخارق - تدرج ذهبي متوهج */
        .super-button {
            width: 100%; background: linear-gradient(135deg, #fceabb 0%, #f8b500 50%, #fceabb 100%);
            border: none; border-radius: 25px; padding: 20px;
            color: #403000; font-size: 26px; font-weight: 900;
            text-transform: uppercase; letter-spacing: 2px;
            box-shadow: 0 0 30px rgba(248, 181, 0, 0.4);
            cursor: pointer; position: relative; overflow: hidden;
        }
        .super-button:after {
            content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
            background: rgba(255,255,255,0.2); transform: rotate(45deg);
            animation: shine 3s infinite;
        }

        /* الأنميشن */
        @keyframes float { 0%, 100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(-20px) rotate(2deg); } }
        @keyframes pulse-aura { from { opacity: 0.1; } to { opacity: 0.3; } }
        @keyframes shine { from { left: -150%; } to { left: 150%; } }

            position: fixed; bottom: 15px; left: 15px; right: 15px;
