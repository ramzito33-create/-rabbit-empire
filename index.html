<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TON EMPIRE | PRO</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --accent: #00f2ff; --bg: #050a12; --card: #0e1621; --gold: #ffcf4d; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; user-select: none; }
        body { background: var(--bg); color: white; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        /* الهيدر الاحترافي */
        .header { padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .user-info { display: flex; align-items: center; gap: 10px; }
        .avatar { width: 35px; height: 35px; background: var(--accent); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; color: black; }

        /* منطقة الرصيد */
        .main-card { flex: 1; padding: 30px 20px; text-align: center; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .balance-label { font-size: 12px; color: #888; letter-spacing: 2px; }
        .balance-value { font-size: 45px; font-weight: 900; margin: 10px 0; color: var(--accent); text-shadow: 0 0 20px rgba(0, 242, 255, 0.3); }
        
        /* المفاعل (The Engine) */
        .engine { width: 180px; height: 180px; position: relative; border-radius: 50%; border: 2px solid rgba(0,242,255,0.1); display: flex; align-items: center; justify-content: center; margin: 30px 0; }
        .engine-core { width: 80px; height: 80px; background: var(--accent); border-radius: 50%; box-shadow: 0 0 50px var(--accent); animation: breathe 3s infinite ease-in-out; }
        @keyframes breathe { 0%, 100% { transform: scale(1); opacity: 0.6; } 50% { transform: scale(1.2); opacity: 1; } }

        /* القائمة السفلية */
        .nav { position: fixed; bottom: 20px; left: 15px; right: 15px; background: var(--card); border-radius: 25px; padding: 12px; display: flex; justify-content: space-around; border: 1px solid rgba(255,255,255,0.08); }
        .nav-item { display: flex; flex-direction: column; align-items: center; color: #555; font-size: 10px; font-weight: bold; cursor: pointer; }
        .nav-item.active { color: var(--accent); }
        .nav-item i { font-size: 22px; margin-bottom: 4px; }
    </style>
</head>
<body>

    <div class="header">
        <div class="user-info">
            <div class="avatar" id="user-initial">U</div>
            <span id="user-name">User</span>
        </div>
        <div style="color: var(--gold); font-weight: bold;">VIP 👑</div>
    </div>

    <div class="main-card">
        <p class="balance-label">TOTAL ASSETS</p>
        <h1 class="balance-value">$ <span id="balance">0.000000</span></h1>
        <p style="color: #00ff88; font-size: 13px;">Profit: +<span id="rate">0.00001</span>/s</p>
        
        <div class="engine">
            <div class="engine-core"></div>
        </div>
    </div>

    <div class="nav">
        <div class="nav-item active"><i>🏠</i><span>HOME</span></div>
        <div class="nav-item"><i>⛏️</i><span>MINE</span></div>
        <div class="nav-item"><i>💼</i><span>WALLET</span></div>
        <div class="nav-item"><i>👥</i><span>FRIENDS</span></div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();

        // جلب بيانات المستخدم الحقيقية من تلجرام
        const user = tg.initDataUnsafe.user;
        if (user) {
            document.getElementById('user-name').innerText = user.first_name;
            document.getElementById('user-initial').innerText = user.first_name.charAt(0);
        }

        // نظام التعدين الحسابي (Elapsed Time Calculation)
        let balance = parseFloat(localStorage.getItem('balance')) || 0.0;
        let rate = parseFloat(localStorage.getItem('rate')) || 0.00001;
        let lastUpdate = parseInt(localStorage.getItem('last_update')) || Date.now();

        // حساب الأرباح التي ضاعت أثناء إغلاق البوت (Passive Income)
        const now = Date.now();
        const elapsedSeconds = (now - lastUpdate) / 1000;
        const offlineProfit = elapsedSeconds * rate;
        balance += offlineProfit;

        function updateUI() {
            balance += (rate / 10);
            document.getElementById('balance').innerText = balance.toFixed(6);
            localStorage.setItem('balance', balance);
            localStorage.setItem('last_update', Date.now());
        }

        setInterval(updateUI, 100);
        if(tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
    </script>
</body>
</html>
